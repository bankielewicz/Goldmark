<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Goldmark top bar with the As-of control</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<header style="{{rootStyle}}">
  <button type="button" aria-label="Open navigation" style="width: 32px; height: 32px; flex: none; display: flex; align-items: center; justify-content: center; border: none; border-radius: 4px; background: transparent; color: var(--fg2)"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14"></path></svg></button>
  <span aria-hidden="true" style="width: 24px; height: 24px; flex: none; border-radius: 4px; background: var(--brand); color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700">G</span>
  <sc-if value="{{showName}}" hint-placeholder-val="{{true}}"><span style="font-weight: 600; white-space: nowrap">Goldmark</span></sc-if>
  <div style="flex: 1"></div>
  <sc-if value="{{showBox}}" hint-placeholder-val="{{true}}">
    <div role="search" style="width: 300px; height: 32px; box-sizing: border-box; padding: 0 8px; display: flex; align-items: center; gap: 6px; background: var(--bg1); border: 1px solid var(--st1); border-bottom-color: var(--stacc); border-radius: 4px; color: var(--fg2)"><svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true" style="flex: none"><path d="M8.5 3a5.5 5.5 0 1 1 0 11 5.5 5.5 0 0 1 0-11zM12.5 12.5L17 17"></path></svg><input type="search" aria-label="Search CIs" placeholder="Search CIs by name" style="flex: 1; min-width: 0; border: none; background: transparent; color: var(--fg1); font: inherit; outline: none"></div>
  </sc-if>
  <sc-if value="{{showIcon}}" hint-placeholder-val="{{false}}">
    <button type="button" aria-label="Search CIs" aria-haspopup="dialog" style="width: 32px; height: 32px; flex: none; display: flex; align-items: center; justify-content: center; border: none; border-radius: 4px; background: transparent; color: var(--fg2)"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M8.5 3a5.5 5.5 0 1 1 0 11 5.5 5.5 0 0 1 0-11zM12.5 12.5L17 17"></path></svg></button>
  </sc-if>
  <span style="position: relative; display: inline-flex; flex: none">
    <button type="button" aria-haspopup="dialog" aria-label="{{asAria}}" aria-disabled="{{asDisabled}}" aria-describedby="{{asTipId}}" style="{{asStyle}}"><svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M3.5 10a6.5 6.5 0 1 0 2-4.7M3 3.5V7h3.5M10 6.5V10l2.5 1.5"></path></svg><span>{{asLabel}}</span></button>
    <sc-if value="{{showTip}}" hint-placeholder-val="{{false}}"><span id="asof-tip" role="tooltip" style="position: absolute; right: 0; top: 40px; padding: 5px 10px; background: var(--bg1); border-radius: 4px; box-shadow: var(--sh16); color: var(--fg1); font-size: 12px; line-height: 16px; white-space: nowrap; z-index: 5">This page always shows the present.</span></sc-if>
  </span>
  <button type="button" aria-label="Switch theme" aria-pressed="{{darkPressed}}" style="width: 32px; height: 32px; flex: none; display: flex; align-items: center; justify-content: center; border: none; border-radius: 4px; background: transparent; color: var(--fg2)"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M15 12.5A6.5 6.5 0 0 1 7.5 3a6.5 6.5 0 1 0 7.5 9.5z"></path></svg></button>
  <button type="button" aria-label="DK, Account: Dana Kowalski" aria-haspopup="menu" style="height: 32px; flex: none; display: flex; align-items: center; gap: 6px; padding: 0 4px; border: none; border-radius: 4px; background: transparent; color: var(--fg2)"><span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 50%; background: var(--bbg2); color: var(--bfg1); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600">DK</span><svg width="12" height="12" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 8l5 5 5-5"></path></svg></button>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"width":{"editor":"int","default":1440},"search":{"editor":"enum","options":["box","icon","none"],"default":"box"},"asof":{"editor":"enum","options":["now","on","early","disabled"],"default":"now"},"tip":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":48}}'>
class Component extends DCLogic {
  renderVals() {
    const LIGHT = '--bg1:#ffffff;--bg2:#fafafa;--fg1:#242424;--fg2:#424242;--fg3:#616161;--st1:#d1d1d1;--st2:#e0e0e0;--stacc:#616161;--brand:#8a5a00;--bfg1:#8a5a00;--bbg2:#fcefd8;--fo:#000000;--bgdis:#f0f0f0;--stdis:#e0e0e0;--fgdis:#bdbdbd;--sh16:0 0 2px rgba(0,0,0,.12),0 8px 16px rgba(0,0,0,.14);';
    const DARK = '--bg1:#292929;--bg2:#1f1f1f;--fg1:#ffffff;--fg2:#d6d6d6;--fg3:#adadad;--st1:#666666;--st2:#525252;--stacc:#adadad;--brand:#7d5200;--bfg1:#c28a2a;--bbg2:#2c1d00;--fo:#ffffff;--bgdis:#141414;--stdis:#424242;--fgdis:#5c5c5c;--sh16:0 0 2px rgba(0,0,0,.24),0 8px 16px rgba(0,0,0,.28);';
    const dark = this.props.dark ?? false;
    const width = this.props.width ?? 1440;
    const search = this.props.search ?? 'box';
    const asof = this.props.asof ?? 'now';
    const tip = this.props.tip ?? false;
    const wide = width >= 1100;
    const phone = width < 600;
    // The moment: full on a wide bar, shortened on the 1024 rail and on a phone. A moment in another year keeps its year.
    const MOMENT = {
      on: { full: '2026-10-06 14:00 UTC', short: '06 Oct 14:00' },
      early: { full: '2019-03-01 09:00 UTC', short: '01 Mar 2019 09:00' }
    }[asof];
    const disabled = asof === 'disabled';
    const value = MOMENT ? MOMENT.full : 'Now';
    const base = 'height: 32px; box-sizing: border-box; padding: 0 ' + (wide ? 12 : 8) + 'px; display: inline-flex; align-items: center; gap: 6px; border-radius: 4px; font: inherit; font-weight: 600; white-space: nowrap; ';
    const asStyle = base + (disabled
      ? 'background: var(--bgdis); border: 1px solid var(--stdis); color: var(--fgdis); cursor: not-allowed' + (tip ? '; outline: 2px solid var(--fo); outline-offset: 1px' : '')
      : MOMENT
        ? 'background: var(--bbg2); border: 1px solid var(--bfg1); color: var(--fg1)'
        : 'background: var(--bg1); border: 1px solid var(--st1); color: var(--fg1)');
    return {
      rootStyle: (dark ? DARK : LIGHT) + 'position: relative; width: ' + width + 'px; height: 48px; box-sizing: border-box; display: flex; align-items: center; gap: ' + (phone ? 8 : 12) + 'px; padding: 0 ' + (phone ? 6 : 12) + 'px; background: var(--bg2); border-bottom: 1px solid var(--st2); color: var(--fg1); font-family: \'Segoe UI\', -apple-system, BlinkMacSystemFont, Roboto, \'Helvetica Neue\', sans-serif; font-size: 14px; line-height: 20px;',
      showName: !phone,
      showBox: search === 'box',
      showIcon: search === 'icon',
      darkPressed: dark ? 'true' : 'false',
      asLabel: wide ? 'As of: ' + value : (MOMENT ? MOMENT.short : 'Now'),
      asAria: 'As of: ' + value + '. Choose a point in time',
      asDisabled: disabled ? 'true' : null,
      asTipId: disabled ? 'asof-tip' : null,
      asStyle,
      showTip: disabled && tip
    };
  }
}
</script>
</body>
</html>
