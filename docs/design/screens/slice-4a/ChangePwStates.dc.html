<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Goldmark change password states</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1840px; height: 1880px; box-sizing: border-box; padding: 40px; background: #fafafa; color: #242424; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', sans-serif; font-size: 14px; line-height: 20px; display: flex; flex-direction: column; gap: 24px">
  <div style="display: flex; flex-direction: column; gap: 6px">
    <h1 style="margin: 0; font-size: 28px; line-height: 36px; font-weight: 600">Change password · states</h1>
    <p style="margin: 0; color: #424242">A wrong current password counts toward the lockout, as at sign-in; when the account locks, the person stays signed in (as the two-factor page's dialogs). On a phone the dialog is full width under 480 px.</p>
  </div>
  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 40px">
    <sc-for list="{{cards}}" as="c" hint-placeholder-count="6">
      <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px">
        <figcaption style="font-size: 12px; line-height: 16px; font-weight: 600; color: #616161">{{c.label}}</figcaption>
        <dc-import name="ChangePasswordDialog" dark="{{c.dark}}" state="{{c.state}}" hint-size="480px,640px"></dc-import>
      </figure>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1840,"height":1880}}'>
class Component extends DCLogic {
  renderVals() {
    const card = (label, state, dark) => ({ label, state, dark: !!dark });
    return {
      cards: [
        card('Wrong current password', 'wrongCurrent'),
        card('Dark · wrong current password', 'wrongCurrent', true),
        card('Rules not met (common password, mismatch)', 'ruleErrors'),
        card('Changing (loading)', 'loading'),
        card('Locked after repeated failures', 'locked'),
        card('Network error, with Retry and Reference ID', 'network')
      ]
    };
  }
}
</script>
</body>
</html>
