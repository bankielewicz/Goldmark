<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Goldmark change password dialog</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="{{rootStyle}}">
  <div role="dialog" aria-modal="true" aria-labelledby="cpd-title-{{uid}}" style="width: 100%; box-sizing: border-box; background: var(--bg1); border-radius: 8px; box-shadow: var(--sh64); padding: 24px; display: flex; flex-direction: column; gap: 12px">
    <h2 id="cpd-title-{{uid}}" style="margin: 0; font-size: 20px; line-height: 28px; font-weight: 600">Change your password</h2>

    <sc-if value="{{msg.show}}" hint-placeholder-val="{{false}}">
      <div role="alert" style="display: flex; gap: 8px; align-items: flex-start; padding: 8px 12px; background: {{msg.bg}}; border: 1px solid {{msg.bd}}; border-radius: 4px">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="{{msg.icon}}" stroke-width="1.6" aria-hidden="true" style="flex: none; margin-top: 2px"><path d="{{msg.path}}"></path></svg>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 4px">
          <span>{{msg.text}}</span>
          <sc-if value="{{msg.reference}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; line-height: 16px; color: var(--fg2)">Reference ID <span style="font-family: Consolas, 'Courier New', monospace">c41e07ab</span> <button type="button" style="height: 24px; padding: 0 6px; border: none; border-radius: 4px; background: transparent; color: var(--blink); font: inherit; font-size: 12px; text-decoration: underline">Copy</button></span></sc-if>
        </div>
        <sc-if value="{{msg.reference}}" hint-placeholder-val="{{false}}"><button type="button" style="height: 24px; padding: 0 8px; background: var(--bg1); border: 1px solid var(--st1); border-radius: 4px; color: var(--fg1); font: inherit; font-size: 12px; font-weight: 600">Retry</button></sc-if>
      </div>
    </sc-if>

    <div style="display: flex; flex-direction: column; gap: 2px">
      <label for="cpd-cur-{{uid}}" style="font-weight: 600">Current password</label>
      <div style="{{curBox}}">
        <input id="cpd-cur-{{uid}}" type="password" autocomplete="current-password" value="sample-password" readonly="{{readOnly}}" aria-invalid="{{curInvalid}}" style="flex: 1; min-width: 0; border: none; background: transparent; color: var(--fg1); font: inherit; outline: none">
        <button type="button" aria-label="Show password" aria-pressed="false" style="width: 28px; height: 28px; border: none; border-radius: 4px; background: transparent; color: var(--fg2); display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2 10s3-6 8-6 8 6 8 6-3 6-8 6-8-6-8-6z"></path><circle cx="10" cy="10" r="2.5"></circle></svg></button>
      </div>
      <sc-if value="{{curInvalid}}" hint-placeholder-val="{{false}}"><span style="display: flex; align-items: center; gap: 4px; font-size: 12px; line-height: 16px; color: var(--rdfg)"><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="8" cy="8" r="6.5"></circle><path d="M5.5 5.5l5 5M10.5 5.5l-5 5"></path></svg>That password is incorrect.</span></sc-if>
    </div>

    <div style="display: flex; flex-direction: column; gap: 2px">
      <label for="cpd-new-{{uid}}" style="font-weight: 600">New password</label>
      <div style="{{newBox}}">
        <input id="cpd-new-{{uid}}" type="password" autocomplete="new-password" value="{{newValue}}" readonly="{{readOnly}}" aria-invalid="{{rulesBad}}" style="flex: 1; min-width: 0; border: none; background: transparent; color: var(--fg1); font: inherit; outline: none">
        <button type="button" aria-label="Show password" aria-pressed="false" style="width: 28px; height: 28px; border: none; border-radius: 4px; background: transparent; color: var(--fg2); display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2 10s3-6 8-6 8 6 8 6-3 6-8 6-8-6-8-6z"></path><circle cx="10" cy="10" r="2.5"></circle></svg></button>
      </div>
      <sc-if value="{{rulesBad}}" hint-placeholder-val="{{false}}"><span style="display: flex; align-items: center; gap: 4px; font-size: 12px; line-height: 16px; color: var(--rdfg)"><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="8" cy="8" r="6.5"></circle><path d="M5.5 5.5l5 5M10.5 5.5l-5 5"></path></svg>This is a commonly used password. Choose another.</span></sc-if>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <label for="cpd-new2-{{uid}}" style="font-weight: 600">Confirm new password</label>
      <input id="cpd-new2-{{uid}}" type="password" autocomplete="new-password" value="{{confirmValue}}" readonly="{{readOnly}}" aria-invalid="{{rulesBad}}" style="{{confirmStyle}}">
      <sc-if value="{{rulesBad}}" hint-placeholder-val="{{false}}"><span style="display: flex; align-items: center; gap: 4px; font-size: 12px; line-height: 16px; color: var(--rdfg)"><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="8" cy="8" r="6.5"></circle><path d="M5.5 5.5l5 5M10.5 5.5l-5 5"></path></svg>The passwords don't match.</span></sc-if>
    </div>
    <ul aria-label="Password rules" style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; font-size: 12px; line-height: 16px">
      <sc-for list="{{rules}}" as="ru" hint-placeholder-count="3">
        <li style="{{ru.style}}"><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="{{ru.icon}}"></path></svg>{{ru.text}}</li>
      </sc-for>
    </ul>
    <p style="margin: 0; color: var(--fg2)">You stay signed in here. Goldmark signs you out on your other devices and browsers.</p>

    <div style="display: flex; justify-content: flex-end; gap: 8px; padding-top: 4px">
      <button type="button" style="height: 32px; padding: 0 16px; background: var(--bg1); border: 1px solid var(--st1); border-radius: 4px; color: var(--fg1); font: inherit; font-weight: 600">Cancel</button>
      <button type="button" disabled="{{off}}" style="{{primaryStyle}}"><sc-if value="{{loading}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="width: 14px; height: 14px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent"></span></sc-if>{{primaryLabel}}</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"width":{"editor":"int","default":480},"state":{"editor":"enum","options":["none","wrongCurrent","ruleErrors","loading","locked","network"],"default":"none"},"$preview":{"width":480,"height":600}}'>
class Component extends DCLogic {
  renderVals() {
    const LIGHT = '--bg1:#ffffff;--bg2:#fafafa;--fg1:#242424;--fg2:#424242;--fg3:#616161;--fgdis:#bdbdbd;--st1:#d1d1d1;--st2:#e0e0e0;--stacc:#616161;--brand:#8a5a00;--blink:#7d5200;--rdfg:#bc2f32;--gnfg:#0e700e;--mberr:#fdf3f4;--mberrbd:#eeacb2;--mberri:#b10e1c;--mbwrn:#fff9f5;--mbwrnbd:#fdcfb4;--mbwrni:#bc4b09;--sh64:0 0 8px rgba(0,0,0,.12),0 32px 64px rgba(0,0,0,.14);';
    const DARK = '--bg1:#292929;--bg2:#1f1f1f;--fg1:#ffffff;--fg2:#d6d6d6;--fg3:#adadad;--fgdis:#5c5c5c;--st1:#666666;--st2:#525252;--stacc:#adadad;--brand:#7d5200;--blink:#c28a2a;--rdfg:#e37d80;--gnfg:#54b054;--mberr:#3b0509;--mberrbd:#c50f1f;--mberri:#dc626d;--mbwrn:#4a1e04;--mbwrnbd:#f7630c;--mbwrni:#f98845;--sh64:0 0 8px rgba(0,0,0,.24),0 32px 64px rgba(0,0,0,.28);';
    const dark = this.props.dark ?? false;
    const width = this.props.width ?? 480;
    const state = this.props.state ?? 'none';
    const loading = state === 'loading';
    const locked = state === 'locked';
    const curBad = state === 'wrongCurrent';
    const rulesBad = state === 'ruleErrors';
    const messages = {
      locked: ['var(--mbwrn)', 'var(--mbwrnbd)', 'var(--mbwrni)', 'M8 1.8L14.6 13.5H1.4ZM8 6v3.5M8 11.3v.2', 'Too many wrong tries. Your account is locked for 15 minutes; you stay signed in.', false],
      network: ['var(--mberr)', 'var(--mberrbd)', 'var(--mberri)', 'M8 1.5a6.5 6.5 0 1 1 0 13 6.5 6.5 0 0 1 0-13zM5.5 5.5l5 5M10.5 5.5l-5 5', 'Couldn’t reach Goldmark. Your password hasn’t changed; try again.', true]
    };
    const m = messages[state];
    const box = (bad) => 'display: flex; align-items: center; height: 32px; box-sizing: border-box; padding: 0 2px 0 10px; background: var(--bg1); border: 1px solid var(--st1); border-radius: 4px; border-bottom: ' + (bad ? '2px solid var(--rdfg)' : '1px solid var(--stacc)');
    const check = 'M8 1.5a6.5 6.5 0 1 1 0 13 6.5 6.5 0 0 1 0-13zM5 8.2l2 2 4-4.4';
    const cross = 'M8 1.5a6.5 6.5 0 1 1 0 13 6.5 6.5 0 0 1 0-13zM5.5 5.5l5 5M10.5 5.5l-5 5';
    const dot = 'M8 1.5a6.5 6.5 0 1 1 0 13 6.5 6.5 0 0 1 0-13z';
    const rule = (text, status) => ({ text: text + (status === 'pass' ? ' · done' : status === 'fail' ? ' · not met' : ''), icon: status === 'pass' ? check : status === 'fail' ? cross : dot, style: 'display: flex; align-items: center; gap: 6px; color: ' + (status === 'pass' ? 'var(--gnfg)' : status === 'fail' ? 'var(--rdfg)' : 'var(--fg3)') });
    const off = loading || locked;
    const primary = 'height: 32px; padding: 0 16px; display: flex; align-items: center; gap: 8px; border-radius: 4px; font: inherit; font-weight: 600; ';
    return {
      rootStyle: (dark ? DARK : LIGHT) + 'width: ' + width + 'px; box-sizing: border-box; color: var(--fg1); font-family: \'Segoe UI\', -apple-system, BlinkMacSystemFont, Roboto, \'Helvetica Neue\', sans-serif; font-size: 14px; line-height: 20px;',
      uid: (dark ? 'd' : 'l') + state + width,
      msg: m ? { show: true, bg: m[0], bd: m[1], icon: m[2], path: m[3], text: m[4], reference: m[5] } : { show: false },
      readOnly: off,
      curInvalid: curBad,
      curBox: box(curBad),
      newValue: 'sample-new-password',
      confirmValue: rulesBad ? 'sample-new-passwrd' : 'sample-new-password',
      rulesBad,
      newBox: box(rulesBad),
      confirmStyle: 'height: 32px; box-sizing: border-box; padding: 0 10px; background: var(--bg1); border: 1px solid var(--st1); border-radius: 4px; color: var(--fg1); font: inherit; border-bottom: ' + (rulesBad ? '2px solid var(--rdfg)' : '1px solid var(--stacc)'),
      rules: rulesBad
        ? [rule('12 to 128 characters', 'pass'), rule('Not a commonly used password', 'fail'), rule('Matches the confirmation', 'fail')]
        : [rule('12 to 128 characters', 'pass'), rule('Not a commonly used password (checked when you save)', 'pending'), rule('Matches the confirmation', 'pass')],
      loading,
      off,
      primaryLabel: loading ? 'Changing…' : 'Change password',
      primaryStyle: primary + (off ? 'border: 1px solid var(--st2); background: var(--bg2); color: var(--fgdis)' : 'border: none; background: var(--brand); color: #ffffff')
    };
  }
}
</script>
</body>
</html>
