<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Goldmark navigation with Inventory</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<nav aria-label="Main" style="{{rootStyle}}">
  <sc-for list="{{nav}}" as="g" hint-placeholder-count="3">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <sc-if value="{{g.heading}}" hint-placeholder-val="{{true}}"><div style="padding: 12px 12px 4px; font-size: 12px; line-height: 16px; font-weight: 600; color: var(--fg3)">{{g.label}}</div></sc-if>
      <a href="#" aria-current="{{g.current}}" aria-label="{{g.aria}}" style="{{g.style}}"><span style="{{g.bar}}"></span><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true" style="flex: none"><path d="{{g.icon}}"></path></svg><sc-if value="{{labels}}" hint-placeholder-val="{{true}}"><span>{{g.item}}</span></sc-if></a>
    </div>
  </sc-for>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"width":{"editor":"int","default":1440},"height":{"editor":"int","default":852},"current":{"editor":"enum","options":["search","dashboard","users","audit","none"],"default":"search"},"role":{"editor":"enum","options":["editor","viewer","admin","auditor"],"default":"editor"},"$preview":{"width":260,"height":852}}'>
class Component extends DCLogic {
  renderVals() {
    const LIGHT = '--bg2:#fafafa;--fg1:#242424;--fg2:#424242;--fg3:#616161;--st2:#e0e0e0;--bfg1:#8a5a00;--bbg2:#fcefd8;';
    const DARK = '--bg2:#1f1f1f;--fg1:#ffffff;--fg2:#d6d6d6;--fg3:#adadad;--st2:#525252;--bfg1:#c28a2a;--bbg2:#2c1d00;';
    const dark = this.props.dark ?? false;
    const width = this.props.width ?? 1440;
    const height = this.props.height ?? 852;
    const current = this.props.current ?? 'search';
    const role = this.props.role ?? 'editor';
    const wide = width >= 1100;
    const item = (label, heading, text, icon, key) => ({
      label, heading: heading && wide, item: text, icon, aria: wide ? null : text,
      current: key === current ? 'page' : null,
      style: 'position: relative; display: flex; align-items: center; gap: 10px; height: 40px; box-sizing: border-box; padding: 0 ' + (wide ? '12px' : '0') + '; justify-content: ' + (wide ? 'flex-start' : 'center') + '; border-radius: 4px; text-decoration: none; ' + (key === current ? 'background: var(--bbg2); color: var(--fg1); font-weight: 600' : 'color: var(--fg2)'),
      bar: key === current ? 'position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 2px; background: var(--bfg1)' : 'display: none'
    });
    const nav = [
      item('Overview', true, 'Dashboard', 'M3 3h6v6H3zM11 3h6v4h-6zM11 9h6v8h-6zM3 11h6v6H3z', 'dashboard'),
      item('Inventory', true, 'Search', 'M8.5 3a5.5 5.5 0 1 1 0 11 5.5 5.5 0 0 1 0-11zM12.5 12.5L17 17', 'search')
    ];
    if (role === 'admin') {
      nav.push(item('Administration', true, 'Users & roles', 'M7 9a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM2 17c0-3 2.2-5 5-5s5 2 5 5M13 9a2.5 2.5 0 1 0 0-5M14 12c2.3.3 4 2.2 4 5', 'users'));
      nav.push(item('Administration', false, 'Audit log', 'M5 2.5h7l3 3v12H5zM12 2.5v3h3M7.5 9h5M7.5 12h5M7.5 15h3', 'audit'));
    } else if (role === 'auditor') {
      nav.push(item('Administration', true, 'Audit log', 'M5 2.5h7l3 3v12H5zM12 2.5v3h3M7.5 9h5M7.5 12h5M7.5 15h3', 'audit'));
    }
    return {
      rootStyle: (dark ? DARK : LIGHT) + 'width: ' + (wide ? 260 : 48) + 'px; height: ' + height + 'px; box-sizing: border-box; padding: 8px ' + (wide ? '8px' : '4px') + '; background: var(--bg2); border-right: 1px solid var(--st2); display: flex; flex-direction: column; gap: 2px; color: var(--fg1); font-family: \'Segoe UI\', -apple-system, BlinkMacSystemFont, Roboto, \'Helvetica Neue\', sans-serif; font-size: 14px; line-height: 20px;',
      labels: wide,
      nav
    };
  }
}
</script>
</body>
</html>
