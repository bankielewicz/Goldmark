<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Goldmark invitation and reset states</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1840px; height: 1800px; box-sizing: border-box; padding: 40px; background: #fafafa; color: #242424; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', sans-serif; font-size: 14px; line-height: 20px; display: flex; flex-direction: column; gap: 24px">
  <div style="display: flex; flex-direction: column; gap: 6px">
    <h1 style="margin: 0; font-size: 28px; line-height: 36px; font-weight: 600">Accept invitation / set up two-factor again · states</h1>
    <p style="margin: 0; color: #424242">Used and revoked links share one message, so a page never reveals which. Five wrong codes end the link (audited). Links expire after 24 hours.</p>
  </div>
  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 40px">
    <sc-for list="{{cards}}" as="c" hint-placeholder-count="6">
      <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px">
        <figcaption style="font-size: 12px; line-height: 16px; font-weight: 600; color: #616161">{{c.label}}</figcaption>
        <dc-import name="WizardCard" dark="{{c.dark}}" flow="{{c.flow}}" step="{{c.step}}" state="{{c.state}}" hint-size="560px,780px"></dc-import>
      </figure>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1840,"height":1800}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      cards: [
        { label: 'Wrong code · tries left shown', flow: 'invite', step: '1', state: 'wrongCode', dark: false },
        { label: 'After 5 wrong codes · link ended', flow: 'invite', step: '1', state: 'dead', dark: false },
        { label: 'Link expired (24 h)', flow: 'invite', step: '1', state: 'expired', dark: false },
        { label: 'Link used or revoked (one message)', flow: 'reset', step: '1', state: 'invalid', dark: false },
        { label: 'Password errors', flow: 'invite', step: '2', state: 'passwordErrors', dark: false },
        { label: 'Dark · wrong 6-digit code', flow: 'invite', step: '3', state: 'wrongTotp', dark: true }
      ]
    };
  }
}
</script>
</body>
</html>
