<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign-in card</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="{{rootStyle}}">
  <main aria-labelledby="signin-heading" style="width: 100%; box-sizing: border-box; background: var(--bg1); border: 1px solid var(--st2); border-radius: 6px; padding: 24px; display: flex; flex-direction: column; gap: 16px">
    <h1 id="signin-heading" tabindex="-1" style="margin: 0; font-size: 24px; line-height: 32px; font-weight: 600">{{heading}}</h1>

    <sc-if value="{{msg.show}}" hint-placeholder-val="{{false}}">
      <div role="{{msg.role}}" tabindex="-1" style="display: flex; gap: 8px; align-items: flex-start; padding: 8px 12px; background: {{msg.bg}}; border: 1px solid {{msg.bd}}; border-radius: 4px; {{msg.ring}}">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="{{msg.icon}}" stroke-width="1.6" aria-hidden="true" style="flex: none; margin-top: 2px"><path d="{{msg.path}}"></path></svg>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 4px">
          <span>{{msg.text}}</span>
          <sc-if value="{{msg.setupLink}}" hint-placeholder-val="{{false}}"><a href="#" style="color: var(--blink)">Go to first-run setup</a></sc-if>
          <sc-if value="{{msg.reference}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; line-height: 16px; color: var(--fg2)">Reference ID <span style="font-family: Consolas, 'Courier New', monospace">0af76519</span> <button type="button" style="height: 24px; padding: 0 6px; border: none; border-radius: 4px; background: transparent; color: var(--blink); font: inherit; font-size: 12px; text-decoration: underline">Copy</button></span></sc-if>
        </div>
        <sc-if value="{{msg.reference}}" hint-placeholder-val="{{false}}"><button type="button" style="height: 24px; padding: 0 8px; background: var(--bg1); border: 1px solid var(--st1); border-radius: 4px; color: var(--fg1); font: inherit; font-size: 12px; font-weight: 600">Retry</button></sc-if>
      </div>
    </sc-if>

    <sc-if value="{{isCredentials}}" hint-placeholder-val="{{true}}">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <label for="si-user-{{uid}}" style="font-weight: 600">Username</label>
        <input id="si-user-{{uid}}" autocomplete="username" readonly="{{loading}}" value="{{username}}" style="height: 32px; box-sizing: border-box; padding: 0 10px; background: var(--bg1); border: 1px solid var(--st1); border-bottom-color: var(--stacc); border-radius: 4px; color: var(--fg1); font: inherit">
      </div>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <label for="si-pw-{{uid}}" style="font-weight: 600">Password</label>
        <div style="display: flex; align-items: center; height: 32px; box-sizing: border-box; padding: 0 2px 0 10px; background: var(--bg1); border: 1px solid var(--st1); border-bottom-color: var(--stacc); border-radius: 4px">
          <input id="si-pw-{{uid}}" type="password" autocomplete="current-password" readonly="{{loading}}" value="{{password}}" style="flex: 1; min-width: 0; border: none; background: transparent; color: var(--fg1); font: inherit; outline: none">
          <button type="button" aria-label="Show password" aria-pressed="false" style="width: 28px; height: 28px; border: none; border-radius: 4px; background: transparent; color: var(--fg2); display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2 10s3-6 8-6 8 6 8 6-3 6-8 6-8-6-8-6z"></path><circle cx="10" cy="10" r="2.5"></circle></svg></button>
        </div>
      </div>
      <button type="submit" disabled="{{loading}}" style="{{primaryStyle}}"><sc-if value="{{loading}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="width: 14px; height: 14px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent"></span></sc-if>{{primaryLabel}}</button>
      <sc-if value="{{oidc}}" hint-placeholder-val="{{true}}">
        <div style="display: flex; align-items: center; gap: 8px; color: var(--fg3); font-size: 12px; line-height: 16px"><span style="flex: 1; height: 1px; background: var(--st2)"></span>or<span style="flex: 1; height: 1px; background: var(--st2)"></span></div>
        <button type="button" style="height: 32px; display: flex; align-items: center; justify-content: center; gap: 8px; background: var(--bg1); border: 1px solid var(--st1); border-radius: 4px; color: var(--fg1); font: inherit; font-weight: 600"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="0" y="0" width="7.5" height="7.5" fill="#f25022"></rect><rect x="8.5" y="0" width="7.5" height="7.5" fill="#7fba00"></rect><rect x="0" y="8.5" width="7.5" height="7.5" fill="#00a4ef"></rect><rect x="8.5" y="8.5" width="7.5" height="7.5" fill="#ffb900"></rect></svg>Sign in with Microsoft<span style="font-size: 10px; line-height: 14px; font-weight: 600; padding: 0 4px; border-radius: 4px; border: 1px solid var(--st1); color: var(--fg3)">P1</span></button>
      </sc-if>
    </sc-if>

    <sc-if value="{{isCode}}" hint-placeholder-val="{{false}}">
      <p style="margin: 0">Enter the 6-digit code from your authenticator app.</p>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <label for="si-code-{{uid}}" style="font-weight: 600">6-digit code</label>
        <input id="si-code-{{uid}}" inputmode="numeric" autocomplete="one-time-code" maxlength="6" value="{{codeValue}}" aria-invalid="{{codeInvalid}}" style="{{codeStyle}}">
      </div>
      <button type="submit" style="{{primaryStyle}}">Verify</button>
      <div style="display: flex; justify-content: space-between; align-items: center">
        <a href="#" style="color: var(--blink)">Use a recovery code instead</a>
        <button type="button" style="height: 32px; padding: 0 12px; border: none; border-radius: 4px; background: transparent; color: var(--fg1); font: inherit">Back</button>
      </div>
    </sc-if>

    <sc-if value="{{isRecovery}}" hint-placeholder-val="{{false}}">
      <p style="margin: 0">Enter one of your recovery codes. Each code works once.</p>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <label for="si-rc-{{uid}}" style="font-weight: 600">Recovery code</label>
        <input id="si-rc-{{uid}}" autocomplete="one-time-code" value="7KQ2-M9XD" aria-invalid="{{codeInvalid}}" style="{{codeStyle}}">
      </div>
      <button type="submit" style="{{primaryStyle}}">Verify</button>
      <div style="display: flex; justify-content: space-between; align-items: center">
        <a href="#" style="color: var(--blink)">Use your authenticator app instead</a>
        <button type="button" style="height: 32px; padding: 0 12px; border: none; border-radius: 4px; background: transparent; color: var(--fg1); font: inherit">Back</button>
      </div>
    </sc-if>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"width":{"editor":"int","default":400},"step":{"editor":"enum","options":["credentials","code","recovery"],"default":"credentials"},"state":{"editor":"enum","options":["none","loading","badCredentials","badCode","badRecovery","locked","expired","setup","network","signedOut"],"default":"none"},"oidc":{"editor":"boolean","default":true},"$preview":{"width":400,"height":560}}'>
class Component extends DCLogic {
  renderVals() {
    const LIGHT = '--bg1:#ffffff;--bg2:#fafafa;--bg3:#f5f5f5;--fg1:#242424;--fg2:#424242;--fg3:#616161;--fgdis:#bdbdbd;--st1:#d1d1d1;--st2:#e0e0e0;--stacc:#616161;--brand:#8a5a00;--bfg1:#8a5a00;--blink:#7d5200;--fo:#000000;--rdfg:#bc2f32;--mberr:#fdf3f4;--mberrbd:#eeacb2;--mberri:#b10e1c;--mbwrn:#fff9f5;--mbwrnbd:#fdcfb4;--mbwrni:#bc4b09;--mbinfo:#f5f5f5;--mbinfobd:#d1d1d1;--mbinfoi:#616161;';
    const DARK = '--bg1:#292929;--bg2:#1f1f1f;--bg3:#141414;--fg1:#ffffff;--fg2:#d6d6d6;--fg3:#adadad;--fgdis:#5c5c5c;--st1:#666666;--st2:#525252;--stacc:#adadad;--brand:#7d5200;--bfg1:#c28a2a;--blink:#c28a2a;--fo:#ffffff;--rdfg:#e37d80;--mberr:#3b0509;--mberrbd:#c50f1f;--mberri:#dc626d;--mbwrn:#4a1e04;--mbwrnbd:#f7630c;--mbwrni:#f98845;--mbinfo:#141414;--mbinfobd:#666666;--mbinfoi:#adadad;';
    const dark = this.props.dark ?? false;
    const width = this.props.width ?? 400;
    const state = this.props.state ?? 'none';
    const requested = this.props.step ?? 'credentials';
    const step = state === 'badCode' ? 'code' : state === 'badRecovery' ? 'recovery' : requested;
    const icons = {
      error: 'M8 1.5a6.5 6.5 0 1 1 0 13 6.5 6.5 0 0 1 0-13zM5.5 5.5l5 5M10.5 5.5l-5 5',
      warning: 'M8 1.8L14.6 13.5H1.4ZM8 6v3.5M8 11.3v.2',
      info: 'M8 1.5a6.5 6.5 0 1 1 0 13 6.5 6.5 0 0 1 0-13zM8 7.2v4M8 4.8v.2'
    };
    const kinds = {
      error: ['var(--mberr)', 'var(--mberrbd)', 'var(--mberri)', 'alert'],
      warning: ['var(--mbwrn)', 'var(--mbwrnbd)', 'var(--mbwrni)', 'alert'],
      info: ['var(--mbinfo)', 'var(--mbinfobd)', 'var(--mbinfoi)', 'status']
    };
    const messages = {
      badCredentials: ['error', 'Username or password is incorrect.'],
      badCode: ['error', 'That code didn’t work. Codes change every 30 seconds.'],
      badRecovery: ['error', 'That recovery code didn’t work, or it was already used.'],
      locked: ['warning', 'This account is locked for 15 minutes after 5 failed attempts. Try again later or ask an administrator to unlock it.'],
      expired: ['info', 'Your session expired. Sign in again.'],
      setup: ['info', 'Goldmark isn’t set up yet.'],
      network: ['error', 'Couldn’t reach Goldmark. Check your connection and try again.'],
      signedOut: ['info', 'You’re signed out.']
    };
    const m = messages[state];
    const k = m ? kinds[m[0]] : null;
    const loading = state === 'loading';
    const filled = state !== 'none' && state !== 'expired' && state !== 'setup' && state !== 'signedOut';
    const invalid = state === 'badCode' || state === 'badRecovery';
    const primary = 'height: 32px; display: flex; align-items: center; justify-content: center; gap: 8px; border: none; border-radius: 4px; font: inherit; font-weight: 600; ';
    return {
      rootStyle: (dark ? DARK : LIGHT) + 'width: ' + width + 'px; height: 560px; box-sizing: border-box; padding: 0; background: var(--bg3); color: var(--fg1); font-family: \'Segoe UI\', -apple-system, BlinkMacSystemFont, Roboto, \'Helvetica Neue\', sans-serif; font-size: 14px; line-height: 20px;',
      uid: (dark ? 'd' : 'l') + state + step,
      heading: step === 'code' ? 'Two-factor authentication' : step === 'recovery' ? 'Use a recovery code' : 'Sign in',
      msg: m ? { show: true, text: m[1], bg: k[0], bd: k[1], icon: k[2], role: k[3], path: icons[m[0]], setupLink: state === 'setup', reference: state === 'network', ring: m[0] === 'info' ? '' : 'outline: 2px solid var(--fo); outline-offset: 1px' } : { show: false },
      isCredentials: step === 'credentials',
      isCode: step === 'code',
      isRecovery: step === 'recovery',
      loading,
      username: filled ? 'dana' : '',
      password: filled ? 'correct-horse-sample' : '',
      oidc: (this.props.oidc ?? true) && step === 'credentials',
      primaryLabel: loading ? 'Signing in…' : 'Sign in',
      primaryStyle: primary + (loading ? 'background: var(--bg2); color: var(--fgdis); border: 1px solid var(--st2)' : 'background: var(--brand); color: #ffffff'),
      codeValue: invalid ? '482913' : '',
      codeInvalid: invalid ? 'true' : 'false',
      codeStyle: 'height: 32px; box-sizing: border-box; padding: 0 10px; background: var(--bg1); border: 1px solid var(--st1); border-radius: 4px; color: var(--fg1); font-family: Consolas, \'Courier New\', monospace; font-size: 16px; letter-spacing: 0.15em; border-bottom: ' + (invalid ? '2px solid var(--rdfg)' : '1px solid var(--stacc)')
    };
  }
}
</script>
</body>
</html>
