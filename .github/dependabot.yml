# Dependabot version updates (NFR-SEC-7, NFR-SEC-9). A cooldown delays
# proposals for newly published versions, matching the 7-day release-age
# policy enforced by pnpm. Security updates are not delayed by the cooldown.
version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      web-dev-tooling:
        dependency-type: development
      # react and react-dom must be the same version, or React DOM throws error 527 at load (#43 alone).
      react:
        patterns:
          - "react"
          - "react-dom"
    ignore:
      # typescript-eslint does not support TypeScript 7 yet (#27; it failed PR #9).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Types follow the Node major in .node-version (24); raise this with Node.
      - dependency-name: "@types/node"
        versions: [">=25.0.0"]

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # init and analyze must run the same version, or CodeQL fails (#8 and #10 alone).
      codeql-action:
        patterns:
          - "github/codeql-action"
          - "github/codeql-action/*"
