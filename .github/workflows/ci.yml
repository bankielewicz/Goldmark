# CI for Goldmark. Every job runs with a read-only token and checks out code
# without persisting credentials, so no step (including npm/NuGet tooling) can
# reuse the token. No job references repository secrets.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1" # weekly, so new CodeQL queries and advisories are applied to main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  dependency-policy:
    name: npm dependency policy (runs before any install)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Check allow-list, banned SSR/RSC packages, pnpm/npm settings, lockfile sources
        run: node web/scripts/check-dependency-policy.mjs web
      - name: Policy checker tests
        run: node --test "web/scripts/*.test.mjs"

  web:
    # NFR-SEC-9: the frontend build job has no secrets and no publish credentials.
    name: Web (lint, typecheck, format, build, test, audit)
    needs: dependency-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Enable the pinned pnpm (Corepack verifies its sha512)
        run: corepack enable pnpm && pnpm --version
      - run: pnpm install --frozen-lockfile
      - name: Verify the installed tree from pnpm's own resolution (before any tool runs)
        run: pnpm run policy:installed
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run format:check
      - run: pnpm run build
      - run: pnpm test
      - name: Known vulnerabilities in the npm tree (npm advisory database)
        run: pnpm audit --audit-level low

  dotnet:
    name: .NET (locked restore + audit, format, build, test)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore (locked mode; NuGetAudit fails on any known vulnerability)
        run: dotnet restore Goldmark.slnx --locked-mode
      - run: dotnet format Goldmark.slnx --verify-no-changes --no-restore
      - run: dotnet build Goldmark.slnx -c Release --no-restore
      - run: dotnet test --solution Goldmark.slnx -c Release --no-build

  compose-smoke:
    name: Compose smoke test (real containers, SQL Server 2025 Express, browser)
    needs: [web, dotnet]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Install web test tooling (Playwright library only; uses the runner's Chrome)
        working-directory: web
        run: corepack enable pnpm && pnpm install --frozen-lockfile && pnpm run policy:installed
      - name: Run tests/smoke/compose-smoke.sh
        env:
          GOLDMARK_E2E_CHANNEL: chrome
        run: tests/smoke/compose-smoke.sh

  dependency-review:
    # NFR-SEC-7 / NFR-SEC-9: block PRs that add dependencies with known
    # vulnerabilities (npm and NuGet trees, via the dependency graph).
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          fail-on-scopes: runtime, development, unknown

  codeql:
    # NFR-SEC-7: CodeQL on every PR and on main.
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - name: Build (C#)
        if: matrix.language == 'csharp'
        run: |
          dotnet restore Goldmark.slnx --locked-mode
          dotnet build Goldmark.slnx -c Release --no-restore
      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: /language:${{ matrix.language }}
