# CI for Goldmark. Every job runs with a read-only token and checks out code
# without persisting credentials, so no step (including npm/NuGet tooling) can
# reuse the token. No job references repository secrets.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  dependency-policy:
    name: npm dependency policy (runs before any install)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Check allow-list, banned SSR/RSC packages, pnpm/npm settings, lockfile sources
        run: node web/scripts/check-dependency-policy.mjs web
      - name: Policy checker tests
        run: node --test "web/scripts/*.test.mjs"

  web:
    # NFR-SEC-9: the frontend build job has no secrets and no publish credentials.
    name: Web (lint, typecheck, format, build, test, audit)
    needs: dependency-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Enable the pinned pnpm (Corepack verifies its sha512)
        run: corepack enable pnpm && pnpm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run format:check
      - run: pnpm run build
      - run: pnpm test
      - name: Known vulnerabilities in the npm tree (npm advisory database)
        run: pnpm audit --audit-level low

  dotnet:
    name: .NET (locked restore + audit, format, build, test)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore (locked mode; NuGetAudit fails on any known vulnerability)
        run: dotnet restore Goldmark.slnx --locked-mode
      - run: dotnet format Goldmark.slnx --verify-no-changes --no-restore
      - run: dotnet build Goldmark.slnx -c Release --no-restore
      - run: dotnet test --solution Goldmark.slnx -c Release --no-build

  compose-smoke:
    name: Compose smoke test (real containers, SQL Server 2025 Express, browser)
    needs: [web, dotnet]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Install web test tooling (Playwright library only; uses the runner's Chrome)
        working-directory: web
        run: corepack enable pnpm && pnpm install --frozen-lockfile
      - name: Run tests/smoke/compose-smoke.sh
        env:
          GOLDMARK_E2E_CHANNEL: chrome
        run: tests/smoke/compose-smoke.sh

  # Informational probe: is dependency review / code scanning available on this
  # private, personally owned repository? It never runs CodeQL. Its outcome is
  # written to the job summary; it does not make CI pass or fail, and slice-1
  # acceptance treats CodeQL + dependency review as UNMET until they run for real
  # (see docs/DECISIONS.md DEC-018).
  security-feature-probe:
    name: "Probe (informational): dependency review / code scanning availability"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dependency review
        id: dependency-review
        continue-on-error: true
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
      - name: Empty SARIF for the upload probe
        run: |
          cat > "${RUNNER_TEMP}/empty.sarif" <<'EOF'
          {"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[{"tool":{"driver":{"name":"goldmark-probe","rules":[]}},"results":[]}]}
          EOF
      - name: Code scanning upload
        id: code-scanning
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: ${{ runner.temp }}/empty.sarif
          category: availability-probe
      - name: Report
        env:
          DEPENDENCY_REVIEW: ${{ steps.dependency-review.outcome }}
          CODE_SCANNING: ${{ steps.code-scanning.outcome }}
        run: |
          verdict() { [[ "$1" == success ]] && echo "AVAILABLE" || echo "NOT AVAILABLE ($1) - see the step log"; }
          {
            echo "### Security feature availability (informational)"
            echo "| Feature | Result |"
            echo "|---|---|"
            echo "| Dependency review | $(verdict "${DEPENDENCY_REVIEW}") |"
            echo "| Code scanning (SARIF upload, prerequisite for CodeQL) | $(verdict "${CODE_SCANNING}") |"
            echo
            echo "Slice-1 acceptance for CodeQL and dependency review stays UNMET until both run as real gates."
          } >> "${GITHUB_STEP_SUMMARY}"
