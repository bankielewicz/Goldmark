# Goldmark + bundled SQL Server 2025 Express (US-01, slices 1-2b).
#
#   cp deploy/.env.example deploy/.env    # then fill in every required value
#   docker compose -f deploy/docker-compose.yml up -d --build --wait
#
# Required values have no defaults: Compose refuses to start if any is missing.
# SQL Server is not published to the host and sits on an internal network.
name: goldmark

x-sql-image: &sql-image mcr.microsoft.com/mssql/server:2025-CU9-GDR1-ubuntu-24.04@sha256:742481d1b1186cccc81220a1eaacef244ca8d0f7d19c8e5c70df8ae541ffbab2

services:
  # One-shot: hands the fresh TLS volumes to the mssql user. Root only for chown;
  # no network, no other capabilities, never touches key material.
  sql-volume-init:
    image: *sql-image
    user: "0:0"
    entrypoint: ["/bin/bash", "/goldmark/scripts/volume-init.sh"]
    volumes:
      - ./sqlserver:/goldmark/scripts:ro
      - sql-tls-private:/goldmark/sql-tls-private
      - sql-tls-public:/goldmark/sql-tls-public
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: ["no-new-privileges:true"]
    restart: "no"

  sqlserver:
    image: *sql-image
    entrypoint: ["/bin/bash", "/goldmark/scripts/sql-entrypoint.sh"]
    environment:
      ACCEPT_EULA: ${SQLSERVER_ACCEPT_EULA:?Set SQLSERVER_ACCEPT_EULA=Y in deploy/.env to accept the SQL Server Express license terms}
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${SQLSERVER_SA_PASSWORD:?Set SQLSERVER_SA_PASSWORD in deploy/.env}
      MSSQL_MEMORY_LIMIT_MB: ${SQLSERVER_MEMORY_LIMIT_MB:-2048}
      GOLDMARK_SQL_TLS_HOSTNAME: sqlserver
    volumes:
      - ./sqlserver:/goldmark/scripts:ro
      - sql-data:/var/opt/mssql
      - sql-tls-private:/goldmark/sql-tls-private
      - sql-tls-public:/goldmark/sql-tls-public
    networks: [backend]
    depends_on:
      sql-volume-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/bin/bash", "/goldmark/scripts/healthcheck.sh"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 120s
      start_interval: 3s
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  # One-shot, idempotent. bootstrap-db (as sa) audits the instance and both logins, then creates
  # the database, the least-privilege runtime login and the migration login (db_owner of this
  # database only); migrate (as the migration login) applies the schema migrations and grants
  # the runtime login its role. Only this container receives the sa and migration passwords;
  # the app never does. An existing SQL Server: deploy/docker-compose.external-sql.yml.
  db-init:
    image: goldmark:${GOLDMARK_IMAGE_TAG:-local}
    pull_policy: never
    command: ["bootstrap-db", "migrate"]
    environment:
      Goldmark__Database__Host: sqlserver
      Goldmark__Database__User: ${GOLDMARK_DB_USER:-goldmark_app}
      Goldmark__Database__Password: ${GOLDMARK_DB_PASSWORD:?Set GOLDMARK_DB_PASSWORD in deploy/.env}
      Goldmark__Database__ServerCertificatePath: /run/goldmark/sql-tls/sqlserver.crt
      Goldmark__Migration__User: ${GOLDMARK_DB_MIGRATION_USER:-goldmark_migrator}
      Goldmark__Migration__Password: ${GOLDMARK_DB_MIGRATION_PASSWORD:?Set GOLDMARK_DB_MIGRATION_PASSWORD in deploy/.env}
      Goldmark__Bootstrap__AdminUser: sa
      Goldmark__Bootstrap__AdminPassword: ${SQLSERVER_SA_PASSWORD:?Set SQLSERVER_SA_PASSWORD in deploy/.env}
      # sa is refused everywhere else (DEC-032). The bundled SQL Server has no other administrator
      # yet; slice 2c replaces sa with a generated administrator login.
      Goldmark__Bootstrap__AllowSaAdmin: "true"
      Goldmark__Bootstrap__AdoptExistingLogin: ${GOLDMARK_DB_ADOPT_EXISTING_LOGIN:-false}
      Goldmark__Bootstrap__AcceptedFindings: ${GOLDMARK_DB_ACCEPTED_FINDINGS:-}
    volumes:
      - sql-tls-public:/run/goldmark/sql-tls:ro
    networks: [backend]
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      disable: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: "no"

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: goldmark:${GOLDMARK_IMAGE_TAG:-local}
    environment:
      Goldmark__Database__Host: sqlserver
      Goldmark__Database__User: ${GOLDMARK_DB_USER:-goldmark_app}
      Goldmark__Database__Password: ${GOLDMARK_DB_PASSWORD:?Set GOLDMARK_DB_PASSWORD in deploy/.env}
      Goldmark__Database__ServerCertificatePath: /run/goldmark/sql-tls/sqlserver.crt
      Goldmark__Https__Hostnames: ${GOLDMARK_TLS_HOSTNAMES:-localhost}
      Goldmark__Https__CertificatePath: ${GOLDMARK_TLS_CERT_FILE:-}
      Goldmark__Https__KeyPath: ${GOLDMARK_TLS_KEY_FILE:-}
      Goldmark__Https__Hsts__Enabled: ${GOLDMARK_HSTS_ENABLED:-}
      Goldmark__Https__Hsts__MaxAgeDays: ${GOLDMARK_HSTS_MAX_AGE_DAYS:-365}
      Goldmark__Logging__MinimumLevel: ${GOLDMARK_LOG_LEVEL:-Information}
    ports:
      - "${GOLDMARK_HTTPS_PORT:-8443}:8443"
    volumes:
      - goldmark-tls:/var/lib/goldmark/tls
      - sql-tls-public:/run/goldmark/sql-tls:ro
    networks: [frontend, backend]
    depends_on:
      db-init:
        condition: service_completed_successfully
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

networks:
  frontend: {}
  backend:
    internal: true

volumes:
  sql-data: {}
  sql-tls-private: {}
  sql-tls-public: {}
  goldmark-tls: {}
