# Goldmark with an existing SQL Server 2025 instance (US-01, slices 2b-2c; DEC-033, DEC-034).
#
#   cp deploy/.env.example deploy/.env    # fill in the "Existing SQL Server" section
#   docker compose -f deploy/docker-compose.external-sql.yml up -d --build --wait
#
# There is no SQL Server container: db-init and the app connect to GOLDMARK_DB_HOST. Before
# the first start, read docs/ops/external-sql-server.md: the administrator login (never sa),
# TLS, the principal audit and its finding IDs, and Mode Existing for logins a DBA creates.
# Required values have no defaults: Compose refuses to start if any is missing.
name: goldmark

services:
  # One-shot, idempotent. bootstrap-db (as the administrator login, CONTROL SERVER) audits the
  # instance and Goldmark's two logins, then creates what is missing (Mode Create, with generated
  # names and passwords unless they are set in .env) or nothing at all (Mode Existing), and writes
  # both logins to credential files (DEC-034); migrate (as the migration login) applies the schema
  # migrations. Only this container receives the administrator password and mounts
  # goldmark-db-admin (the migration login); the app reads the runtime login from
  # goldmark-db-runtime, read-only.
  db-init:
    image: goldmark:${GOLDMARK_IMAGE_TAG:-local}
    pull_policy: never
    command: ["bootstrap-db", "migrate"]
    environment:
      Goldmark__Database__Host: ${GOLDMARK_DB_HOST:?Set GOLDMARK_DB_HOST in deploy/.env (the existing SQL Server)}
      Goldmark__Database__Port: ${GOLDMARK_DB_PORT:-1433}
      Goldmark__Database__Name: ${GOLDMARK_DB_NAME:-Goldmark}
      Goldmark__Database__Encrypt: ${GOLDMARK_DB_ENCRYPT:-Strict}
      # Pinned server certificate, if GOLDMARK_SQL_SERVER_CERT_FILE is set (mounted below);
      # otherwise the certificate must chain to a CA the container trusts.
      Goldmark__Database__ServerCertificatePath: ${GOLDMARK_SQL_SERVER_CERT_FILE:+/run/goldmark/sql-tls/server.crt}
      Goldmark__Database__HostNameInCertificate: ${GOLDMARK_DB_HOST_NAME_IN_CERTIFICATE:-}
      # Empty in Mode Create (generated); the DBA's logins in Mode Existing.
      Goldmark__Database__User: ${GOLDMARK_DB_USER:-}
      Goldmark__Database__Password: ${GOLDMARK_DB_PASSWORD:-}
      Goldmark__Database__CredentialFile: /var/lib/goldmark/db-runtime/credential.json
      Goldmark__Migration__User: ${GOLDMARK_DB_MIGRATION_USER:-}
      Goldmark__Migration__Password: ${GOLDMARK_DB_MIGRATION_PASSWORD:-}
      Goldmark__Migration__CredentialFile: /var/lib/goldmark/db-admin/migration.json
      Goldmark__Bootstrap__AdminUser: ${GOLDMARK_DB_ADMIN_USER:?Set GOLDMARK_DB_ADMIN_USER in deploy/.env (a login with CONTROL SERVER; not sa)}
      Goldmark__Bootstrap__AdminPassword: ${GOLDMARK_DB_ADMIN_PASSWORD:?Set GOLDMARK_DB_ADMIN_PASSWORD in deploy/.env}
      Goldmark__Bootstrap__Mode: ${GOLDMARK_DB_BOOTSTRAP_MODE:-Create}
      Goldmark__Bootstrap__AdoptExistingLogin: ${GOLDMARK_DB_ADOPT_EXISTING_LOGIN:-false}
      Goldmark__Bootstrap__AcceptedFindings: ${GOLDMARK_DB_ACCEPTED_FINDINGS:-}
      Goldmark__Bootstrap__WaitSeconds: ${GOLDMARK_DB_WAIT_SECONDS:-120}
      # Audit retention (DEC-041): migrate writes it to the database, where the app reads it.
      Goldmark__Audit__RetentionDays: ${GOLDMARK_AUDIT_RETENTION_DAYS:-365}
    volumes:
      # With no certificate configured, /dev/null is mounted and ignored (no pin is set).
      - ${GOLDMARK_SQL_SERVER_CERT_FILE:-/dev/null}:/run/goldmark/sql-tls/server.crt:ro
      - goldmark-db-runtime:/var/lib/goldmark/db-runtime
      - goldmark-db-admin:/var/lib/goldmark/db-admin
    healthcheck:
      disable: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: "no"

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: goldmark:${GOLDMARK_IMAGE_TAG:-local}
    environment:
      Goldmark__Database__Host: ${GOLDMARK_DB_HOST:?Set GOLDMARK_DB_HOST in deploy/.env (the existing SQL Server)}
      Goldmark__Database__Port: ${GOLDMARK_DB_PORT:-1433}
      Goldmark__Database__Name: ${GOLDMARK_DB_NAME:-Goldmark}
      Goldmark__Database__Encrypt: ${GOLDMARK_DB_ENCRYPT:-Strict}
      Goldmark__Database__ServerCertificatePath: ${GOLDMARK_SQL_SERVER_CERT_FILE:+/run/goldmark/sql-tls/server.crt}
      Goldmark__Database__HostNameInCertificate: ${GOLDMARK_DB_HOST_NAME_IN_CERTIFICATE:-}
      # The runtime login, written by db-init (DEC-034).
      Goldmark__Database__CredentialFile: /var/lib/goldmark/db-runtime/credential.json
      Goldmark__Https__Hostnames: ${GOLDMARK_TLS_HOSTNAMES:-localhost}
      Goldmark__Https__CertificatePath: ${GOLDMARK_TLS_CERT_FILE:-}
      Goldmark__Https__KeyPath: ${GOLDMARK_TLS_KEY_FILE:-}
      Goldmark__Https__Hsts__Enabled: ${GOLDMARK_HSTS_ENABLED:-}
      Goldmark__Https__Hsts__MaxAgeDays: ${GOLDMARK_HSTS_MAX_AGE_DAYS:-365}
      Goldmark__Logging__MinimumLevel: ${GOLDMARK_LOG_LEVEL:-Information}
    ports:
      - "${GOLDMARK_HTTPS_PORT:-8443}:8443"
    volumes:
      - goldmark-tls:/var/lib/goldmark/tls
      # Sign-in key ring (ASP.NET Core Data Protection, DEC-038 item 5); only the app mounts it.
      - goldmark-keys:/var/lib/goldmark/keys
      - ${GOLDMARK_SQL_SERVER_CERT_FILE:-/dev/null}:/run/goldmark/sql-tls/server.crt:ro
      - goldmark-db-runtime:/var/lib/goldmark/db-runtime:ro
    depends_on:
      db-init:
        condition: service_completed_successfully
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

volumes:
  goldmark-tls: {}
  # Back up with the database (see docker-compose.yml).
  goldmark-keys: {}
  goldmark-db-runtime: {}
  goldmark-db-admin: {}
